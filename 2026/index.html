<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Copa Reservado 2026 – Banevalg</title>
<style>
  @font-face {
    font-family: 'Microgramma';
    src: url('../fonts/Microgramma Normal.ttf') format('truetype');
    font-weight: normal;
  }

  :root{
    --gold:#d4af37;
    --ink:#333;
    --ink-2:#666;
    --ink-3:#999;
    --bg:#f0f0f0;
    --card:#fff;
    --rule:#ccc;
    --rule-2:#eee;
    --ok:#3f6f4f;
    --warn:#9a6b1f;
    --stop:#8e4a44;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;}

  .wrap{max-width:1000px;margin:0 auto;padding:40px 20px 80px;}

  h1{
    font-family:'Microgramma',Arial,sans-serif;
    font-size:clamp(28px,5vw,58px);
    letter-spacing:2px;margin:0;text-align:center;
  }
  .sub{
    text-align:center;color:var(--ink-2);margin:10px 0 0;
    font-family:'Courier New',monospace;font-size:clamp(13px,1.8vw,17px);
  }

  .section-title{
    margin:48px auto 16px;display:flex;align-items:center;justify-content:center;gap:14px;
    color:var(--ink-3);font-family:'Microgramma',Arial,sans-serif;letter-spacing:3px;white-space:nowrap;
  }
  .section-title span{font-size:clamp(15px,2.2vw,24px);}
  .section-title::before,.section-title::after{
    content:"";height:1px;flex:1 1 200px;
    background:linear-gradient(to right,var(--rule),var(--gold),var(--rule));opacity:.85;
  }
  .when{
    text-align:center;color:var(--ink-2);margin:0 0 18px;
    font-family:'Courier New',monospace;font-size:13px;
  }

  /* stemmelinje */
  .who{
    margin:30px auto 0;max-width:640px;background:var(--card);border:1px solid var(--rule-2);
    border-radius:10px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  .who label{
    font-family:'Microgramma',Arial,sans-serif;font-size:11px;letter-spacing:2px;color:var(--ink-3);
  }
  .who input{
    font-family:'Courier New',monospace;font-size:15px;color:var(--ink);
    background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 11px;
    flex:0 1 200px;min-width:150px;
  }
  .who input:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .who .hint{font-size:13px;color:var(--ink-2);flex:1 1 200px;min-width:0;}
  .who .hint.alert{color:var(--stop);font-weight:bold;}

  /* rammer */
  .rammer{
    margin:26px auto 0;max-width:940px;display:grid;gap:14px;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  }
  .rammer div{
    background:var(--card);border:1px solid var(--rule-2);border-radius:10px;padding:15px 17px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  .rammer dt{
    font-family:'Microgramma',Arial,sans-serif;font-size:10px;letter-spacing:2px;color:var(--ink-3);
    margin-bottom:6px;
  }
  .rammer dd{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5;}
  .rammer b{color:var(--ink);}

  /* tabell */
  .tablewrap{
    overflow-x:auto;background:var(--card);border:1px solid var(--rule-2);border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  table{border-collapse:collapse;width:100%;min-width:660px;font-size:14px;}
  thead th{
    text-align:left;font-family:'Microgramma',Arial,sans-serif;font-size:9.5px;letter-spacing:1.5px;
    color:var(--ink-3);padding:13px 15px;border-bottom:1px solid var(--rule-2);white-space:nowrap;
  }
  tbody td{padding:12px 15px;border-bottom:1px solid var(--rule-2);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.chosen{background:#fdf8e9;}
  tbody tr.chosen td:first-child{box-shadow:inset 3px 0 0 var(--gold);}
  .bane{font-weight:bold;display:block;}
  .arch{font-size:12px;color:var(--ink-3);display:block;margin-top:2px;}
  .num,.pris{font-family:'Courier New',monospace;white-space:nowrap;}
  .tee{white-space:normal;}
  .pris{font-weight:bold;}
  .status{
    display:inline-block;font-size:11px;font-weight:bold;padding:3px 9px;border-radius:3px;
    white-space:nowrap;box-shadow:inset 0 0 0 1px currentColor;
  }
  .status.ok{color:var(--ok);}
  .status.warn{color:var(--warn);}
  .status.stop{color:var(--stop);}

  th.cbane{width:24%;}
  th.ctid{width:20%;}
  th.cpris{width:12%;}
  th.ckjor{width:9%;}
  th.cstatus{width:15%;}
  td:first-child{min-width:175px;}
  th.vcol,td.vcol{width:1%;}
  .votebtn{
    font-family:'Microgramma',Arial,sans-serif;font-size:10px;letter-spacing:1.5px;
    background:transparent;color:var(--ink-3);border:1px solid var(--rule);border-radius:4px;
    padding:7px 12px;cursor:pointer;white-space:nowrap;
  }
  .votebtn:hover{border-color:var(--gold);color:var(--gold);}
  .votebtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .votebtn[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold);}
  .tally{display:flex;gap:4px;flex-wrap:wrap;min-height:24px;align-items:center;}
  .chip{
    font-family:'Courier New',monospace;font-size:11px;font-weight:bold;
    background:var(--gold);color:#fff;width:25px;height:25px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
  }
  body.novote th.vcol,body.novote td.vcol{display:none;}
  body.novote table{min-width:640px;}

  .basis{
    margin:44px auto 0;max-width:940px;font-size:12px;color:var(--ink-3);line-height:1.7;
    border-top:1px solid var(--rule);padding-top:16px;
  }
  .back{
    display:block;text-align:center;margin-top:30px;color:var(--ink-3);
    font-family:'Microgramma',Arial,sans-serif;font-size:11px;letter-spacing:2px;text-decoration:none;
  }
  .back:hover{color:var(--gold);}

  @media (max-width:600px){
    .wrap{padding:28px 16px 60px;}
    .section-title{gap:10px;}
    .section-title::before,.section-title::after{flex-basis:60px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>COPA RESERVADO</h1>
  <p class="sub" id="sub">VI utgave</p>

  <div class="who">
    <label for="navn">DU STEMMER SOM</label>
    <input id="navn" type="text" placeholder="Initialer" autocomplete="off" maxlength="12">
    <span class="hint" id="hint">Navnet lagres bare på din egen telefon.</span>
  </div>

  <dl class="rammer" id="rammer"></dl>

  <div id="runder"></div>

  <p class="basis" id="basis"></p>
  <a class="back" href="/">TILBAKE TIL HONOUR BOARD</a>

</div>

<script src="../data/copa.js"></script>
<script src="../data/2026.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var AAR = 2026;
  var t = COPA.get(AAR);
  var cfg = window.COPA_SUPABASE || {};
  var live = !!(cfg.url && cfg.anonKey);

  var input = document.getElementById('navn');
  var hint  = document.getElementById('hint');
  var stemmer = {};          // velger -> {navn, 1:bane, 2:bane, 3:bane}
  var meg = '', navn = '';

  function ls(k, v){
    try{
      if(v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    }catch(e){ return null; }
  }

  meg = ls('copa-velger');
  if(!meg){ meg = 'v' + Math.random().toString(36).slice(2,10); ls('copa-velger', meg); }
  navn = ls('copa-navn') || '';
  input.value = navn;

  /* ---------- statisk innhold fra datafila ---------- */

  function dag(iso){ return parseInt(iso.slice(8), 10); }

  document.getElementById('sub').textContent =
    'VI utgave · Marbella ' + dag(t.datoer.fra) + '.–' + dag(t.datoer.til) + '. november 2026 · ' +
    'hcp ' + t.hcpListe.join(' / ').replace(/\./g, ',');

  var r = t.rammer;
  document.getElementById('rammer').innerHTML =
    ramme('DET SOM ER LÅST',
      r.ankomst + ', så runde 1 går mellom 12 og 14. Fredag er fritt, inntil ' +
      '<b>' + (r.maksKjoretid/60) + ' timers</b> kjøring. Lørdag må runden være ferdig til lunsj kl. 15.') +
    ramme('DAGSLYSET',
      'Solnedgang <b>' + r.solnedgang + '</b>, spillbart lys til <b>' + r.sisteLys + '</b>. ' +
      'Klokka stilles tilbake 25. oktober. Siste forsvarlige start er <b>' + r.sisteStart + '</b>.') +
    ramme('PREMIEUTDELING', r.beachclub + '.');

  function ramme(tittel, tekst){
    return '<div><dt>' + tittel + '</dt><dd>' + tekst + '</dd></div>';
  }

  document.getElementById('basis').textContent = t.notat;

  var ROMERTALL = {1:'RUNDE I', 2:'RUNDE II', 3:'RUNDE III'};
  var UKEDAG = {1:'Torsdag 5. november', 2:'Fredag 6. november', 3:'Lørdag 7. november'};

  var html = '';
  t.runder.forEach(function(runde){
    html +=
      '<div class="section-title"><span>' + ROMERTALL[runde.dag] + '</span></div>' +
      '<p class="when">' + UKEDAG[runde.dag] + ' · ' + runde.format + ' · ' + runde.vindu + '</p>' +
      '<div class="tablewrap"><table><thead><tr>' +
        '<th class="cbane">BANE</th><th class="ctid">TID</th><th class="cpris">PRIS PR SPILLER</th>' +
        '<th class="ckjor">FRA ELVIRIA</th><th class="cstatus">STATUS</th>' +
        '<th class="vcol">VELG</th><th class="vcol">STEMMER</th>' +
      '</tr></thead><tbody data-dag="' + runde.dag + '">' +
        runde.kandidater.map(function(k){ return rad(runde.dag, k); }).join('') +
      '</tbody></table></div>';
  });
  document.getElementById('runder').innerHTML = html;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function rad(dag, k){
    var undertekst = [k.arkitekt, k.aapnet, k.beskrivelse].filter(Boolean).join(', ');
    var pris = (k.pris % 1 ? k.pris.toFixed(2) : String(k.pris)).replace('.', ',') + ' €';
    return '<tr data-bane="' + esc(k.bane) + '">' +
      '<td><span class="bane">' + esc(k.bane) + '</span>' +
          '<span class="arch">' + esc(undertekst) + '</span></td>' +
      '<td class="num tee">' + esc(k.tee) + '</td>' +
      '<td class="pris">' + pris + '</td>' +
      '<td class="num">' + k.kjoretid + ' min</td>' +
      '<td><span class="status ' + k.status + '">' + esc(k.merknad) + '</span></td>' +
      '<td class="vcol"><button type="button" class="votebtn" aria-pressed="false" ' +
          'aria-label="Velg ' + esc(k.bane) + '">VELG</button></td>' +
      '<td class="vcol"><div class="tally"></div></td>' +
    '</tr>';
  }

  /* ---------- stemming ---------- */

  if(!live){
    document.body.classList.add('novote');
    hint.textContent = 'Stemmingen er ikke koblet opp ennå. Banene vises som de er.';
    input.disabled = true;
    return;
  }

  var API = cfg.url.replace(/\/+$/, '') + '/rest/v1/stemmer';
  var HEAD = {
    'apikey': cfg.anonKey,
    'Authorization': 'Bearer ' + cfg.anonKey,
    'Content-Type': 'application/json'
  };

  function initialer(n){
    n = (n || '').trim();
    if(!n) return '?';
    var d = n.split(/\s+/);
    return (d.length > 1 ? d[0][0] + d[1][0] : n.slice(0,2)).toUpperCase();
  }

  function tegn(){
    var mine = stemmer[meg] || {};
    document.querySelectorAll('tbody[data-dag]').forEach(function(tb){
      var dag = tb.getAttribute('data-dag');
      tb.querySelectorAll('tr').forEach(function(tr){
        var bane = tr.getAttribute('data-bane');
        var valgt = mine[dag] === bane;
        tr.classList.toggle('chosen', valgt);
        var btn = tr.querySelector('.votebtn');
        btn.setAttribute('aria-pressed', valgt ? 'true' : 'false');
        btn.textContent = valgt ? 'VALGT' : 'VELG';

        var boks = tr.querySelector('.tally');
        boks.textContent = '';
        Object.keys(stemmer).forEach(function(v){
          if(stemmer[v][dag] === bane){
            var c = document.createElement('span');
            c.className = 'chip';
            c.textContent = initialer(stemmer[v].navn);
            c.title = stemmer[v].navn || 'Uten navn';
            boks.appendChild(c);
          }
        });
      });
    });
  }

  function hent(){
    return fetch(API + '?aar=eq.' + AAR + '&select=velger,navn,dag,bane', { headers: HEAD })
      .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
      .then(function(rader){
        var neste = {};
        rader.forEach(function(rad){
          neste[rad.velger] = neste[rad.velger] || { navn: rad.navn };
          neste[rad.velger].navn = rad.navn;
          if(rad.bane) neste[rad.velger][rad.dag] = rad.bane;
        });
        stemmer = neste;
        tegn();
      });
  }

  function lagre(dag, bane){
    return fetch(API + '?on_conflict=aar,velger,dag', {
      method: 'POST',
      headers: Object.assign({ 'Prefer': 'resolution=merge-duplicates' }, HEAD),
      body: JSON.stringify({
        aar: AAR, velger: meg, navn: navn, dag: Number(dag),
        bane: bane || null, oppdatert: new Date().toISOString()
      })
    }).then(function(res){
      if(!res.ok) throw new Error(res.status);
      hint.classList.remove('alert');
      hint.textContent = 'Stemmen er registrert.';
    }).catch(function(){
      hint.classList.add('alert');
      hint.textContent = 'Stemmen ble ikke lagret. Prøv igjen om litt.';
    });
  }

  document.getElementById('runder').addEventListener('click', function(e){
    var btn = e.target.closest('.votebtn');
    if(!btn) return;
    if(!navn){
      hint.classList.add('alert');
      hint.textContent = 'Skriv initialene dine først.';
      input.focus();
      return;
    }
    var tr = btn.closest('tr');
    var dag = tr.closest('tbody').getAttribute('data-dag');
    var bane = tr.getAttribute('data-bane');
    var mine = stemmer[meg] = stemmer[meg] || { navn: navn };
    mine.navn = navn;
    mine[dag] = (mine[dag] === bane) ? null : bane;
    tegn();
    lagre(dag, mine[dag]).then(hent);
  });

  input.addEventListener('input', function(){
    navn = input.value.trim();
    ls('copa-navn', navn);
    if(navn){
      hint.classList.remove('alert');
      hint.textContent = 'Navnet lagres bare på din egen telefon.';
      if(stemmer[meg]){
        stemmer[meg].navn = navn;
        tegn();
        [1,2,3].forEach(function(d){
          if(stemmer[meg][d]) lagre(d, stemmer[meg][d]);
        });
      }
    }
  });

  hent().catch(function(){
    hint.classList.add('alert');
    hint.textContent = 'Får ikke kontakt med stemmingen. Banene vises som de er.';
  });
  setInterval(function(){ hent().catch(function(){}); }, 15000);
})();
</script>
</body>
</html>
