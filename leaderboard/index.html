<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Copa Reservado – Leaderboard</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .year-grid{
      margin: 30px auto 60px;
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
      gap: 16px;
      max-width: 720px;
    }
    .year-card{
      background:#fff; border:1px solid #eee; border-radius:10px;
      padding:18px; text-decoration:none; color:#222;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .year-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .year-card h2{
      margin:0 0 6px;
      font-size:22px;
      font-family:'Microgramma', Arial, sans-serif;
      letter-spacing:2px;
    }
    .year-card p{ margin:0; color:#777; font-size:14px; }
    .year-card .winner{ margin-top:8px; color:var(--gold); font-family:'Courier New', monospace; }
  </style>
</head>
<body class="lb-body">
  <div class="wrap">
    <h1>LEADERBOARD</h1>

    <div class="section-title"><span>YEAR</span></div>

    <div class="year-grid" id="years"></div>
  </div>

  <script src="/data/copa.js"></script>
  <script src="/data/2024.js"></script>
  <script src="/data/2025.js"></script>
  <script src="/data/2026.js"></script>
  <script>
    (function () {
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      var html = COPA.alle().map(function (t) {
        var baner = (t.runder || []).map(function (r) { return r.bane; }).filter(Boolean);
        var linje = baner.length ? baner.join(' · ') : 'Baner ikke bestemt';
        var vinner = t.status === 'ferdig' && t.vinner ? '<p class="winner">' + esc(t.vinner) + '</p>' : '';
        return '<a class="year-card" href="./' + t.aar + '/"><h2>' + t.aar + '</h2>' +
               '<p>' + esc(linje) + '</p>' + vinner + '</a>';
      }).join('');
      document.getElementById('years').innerHTML = html;
    })();
  </script>
</body>
</html>
